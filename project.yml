name: luDuan
options:
  bundleIdPrefix: com.eastlakestudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: J4RT98GF7B
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  luDuan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/app
      - path: Sources/core
      - path: AppSupport
    info:
      path: AppSupport/Info.plist
      properties:
        CFBundleDisplayName: 甪端
        CFBundleName: luDuan
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "8"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: "甪端字游需要使用麦克风，让你用语音拼字闯关。"
        NSSpeechRecognitionUsageDescription: "甪端字游使用语音识别，把你口述的字词转为拼字输入。"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.luduan
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "8"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
