name: luDuan
options:
  bundleIdPrefix: com.eastlakestudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: J4RT98GF7B
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  luDuan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/app
      - path: Sources/core
      - path: AppSupport
    dependencies:
      - target: luDuanWidget
    info:
      path: AppSupport/Info.plist
      properties:
        CFBundleDisplayName: 文绉绉-甪端
        CFBundleName: luDuan
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "12"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: "文绉绉·甪端需要使用麦克风，让你用语音拼字闯关。"
        NSSpeechRecognitionUsageDescription: "文绉绉·甪端使用语音识别，把你口述的字词转为拼字输入。"
        CFBundleURLTypes:
          - CFBundleURLName: com.eastlakestudio.luduan
            CFBundleURLSchemes:
              - luduan
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.luduan
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "12"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: AppSupport/luDuan.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.eastlakestudio.luduan

  luDuanWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/widget
      - path: Sources/core
      - path: AppSupport/BundleModuleShim.swift
    info:
      path: AppSupport/WidgetInfo.plist
      properties:
        CFBundleDisplayName: 甪端小组件
        CFBundleName: luDuanWidget
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "12"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.luduan.widget
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "12"
        OTHER_SWIFT_FLAGS: "-DAPP_EXTENSION"
    entitlements:
      path: AppSupport/luDuanWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.eastlakestudio.luduan

schemes:
  luDuan:
    build:
      targets:
        luDuan: all
        luDuanWidget: [run, profile]
    run:
      target: luDuan
  luDuanWidget:
    build:
      targets:
        luDuanWidget: all
    run:
      target: luDuanWidget
